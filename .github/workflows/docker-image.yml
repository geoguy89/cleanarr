name: Build and publish the image

# Publishes to GitHub's own container registry, so the compose example in the
# README actually works for someone who has not cloned the repository. Without
# this, `image: cleanarr:latest` means "a local image called cleanarr" and
# `docker compose up` fails with "pull access denied" - which is not an obvious
# error to read.
#
# GHCR rather than Docker Hub because it needs no account, no secret and no
# setup: GITHUB_TOKEN is issued to the job automatically.

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Documentation changes do not need a 4GB rebuild.
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The runner ships with a few GB of toolchains this build never uses, and
      # the CUDA base layer alone is over 4GB. Reclaiming the space first is
      # cheaper than debugging a "no space left on device" halfway through.
      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The Dockerfile expects the repository root, because it copies both
          # server/ and web/.
          context: .
          file: docker/Dockerfile
          # amd64 only: the base image is nvidia/cuda, which has no arm64 build.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
