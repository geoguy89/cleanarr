name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Unit and ffmpeg tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The image runs Ubuntu 22.04's Python.
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            tests/requirements.txt
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Python packages
        run: pip install -r server/requirements.txt -r tests/requirements.txt
      - name: Run tests
        run: python -m pytest -m "not e2e and not ui"

  e2e:
    name: End to end (espeak-ng, Whisper tiny.en on CPU)
    runs-on: ubuntu-latest
    env:
      CLEANARR_TEST_MODELS: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            tests/requirements.txt
      - name: Install ffmpeg and espeak-ng
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
      - name: Install Python packages
        run: pip install -r server/requirements.txt -r tests/requirements.txt
      - uses: actions/cache@v4
        with:
          path: .models
          key: whisper-tiny.en-v1
      - name: Run end-to-end tests
        run: python -m pytest -m e2e

  ui:
    name: The page in Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            tests/requirements.txt
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Python packages
        run: pip install -r server/requirements.txt -r tests/requirements.txt
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Run UI tests
        run: python -m pytest -m ui
